<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小棒槌 缺失改善系統</title>
<meta name="theme-color" content="#d9480f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#f6f3ef; --card:#fff; --ink:#2d2a26; --muted:#6f665d; --line:#eadfd5; --steel:#d9480f; --dark:#3a3632;
  --wait:#d64545; --doing:#e08a1e; --check:#2b7bd6; --done:#2f9e5b;
  --c1:#6b4fa0; --c2:#2b7bd6; --c3:#2f9e5b; --line-green:#06c755;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.5;padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:var(--steel);color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
header h1.pick{cursor:pointer}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px;font-family:inherit}
#sync{font-size:12px;opacity:.9;white-space:nowrap;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--dark);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:6px 0 8px;font-size:12px;color:#cfc8c0;font-family:inherit;position:relative}
nav button b{display:block;font-size:21px;line-height:1.3}
nav button.on{color:#ffa94d;font-weight:bold}
nav i{position:absolute;top:2px;left:55%;background:var(--wait);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 5px;min-width:18px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{margin:0 0 8px;font-size:16px;color:var(--dark)}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-size:16px;background:var(--steel);color:#fff;cursor:pointer;font-family:inherit;text-align:center}
.btn.line{background:var(--line-green)}
.btn.ok{background:var(--done)}
.btn.ng{background:var(--wait)}
.btn.ghost{background:#fff;color:var(--steel);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.block{display:block;width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:var(--dark);font-weight:bold}
input[type=text],input[type=date],input[type=tel],input[type=password],input[type=search],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer}
.chip.on{background:var(--steel);border-color:var(--steel);color:#fff}
.chip.add{border-style:dashed;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;color:#fff;margin-right:4px;white-space:nowrap;vertical-align:middle}
.s-wait{background:var(--wait)}.s-doing{background:var(--doing)}.s-check{background:var(--check)}.s-done{background:var(--done)}
.c-結構體{background:var(--c1)}.c-室內裝修{background:var(--c2)}.c-室外裝修{background:var(--c3)}
.tag.pend{background:#868e96}
.dash{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.dash button{border-radius:12px;padding:10px 4px 8px;font-family:inherit;cursor:pointer;font-size:14px;font-weight:bold}
.dash b{display:block;font-size:34px;line-height:1.15}
.dash .d-wait{background:#fff3bf;border:2px solid #fcc419;color:#7a5b00}
.dash .d-late{background:#ffe3e3;border:2px solid #ff8787;color:#a61e1e}
.dash .d-done{background:#d3f9d8;border:2px solid #69db7c;color:#1f6b33}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats button{border:0;border-radius:10px;color:#fff;padding:10px 2px;font-family:inherit;cursor:pointer}
.stats b{display:block;font-size:26px;line-height:1.2}
.stats span{font-size:13px}
.item{display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.item.late{box-shadow:inset 4px 0 0 var(--wait),0 1px 3px rgba(0,0,0,.06)}
.thumb{width:66px;height:66px;border-radius:8px;background:#dfe5ec;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8a96a3;font-size:24px}
.thumb img{width:100%;height:100%;object-fit:cover}
.it-t{font-weight:bold;font-size:15px}
.it-m{font-size:13px;color:var(--muted);margin-top:2px}
.red{color:var(--wait);font-weight:bold}
.bar{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0;cursor:pointer}
.bar .n{width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{flex:1;height:10px;background:#eef1f5;border-radius:5px;overflow:hidden}
.bar .b i{display:block;height:100%}
.bar .c{width:70px;text-align:right;color:var(--muted);font-size:13px}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ph{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;background:#dfe5ec;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0}
.addph{width:80px;height:80px;border:2px dashed #b7c0cc;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
.addph b{font-size:22px;line-height:1.1}
.addph input{display:none}
.kv{width:100%;border-collapse:collapse;font-size:15px}
.kv th{width:84px;text-align:left;color:var(--muted);font-weight:normal;padding:5px 0;vertical-align:top}
.kv td{padding:5px 0}
.log{font-size:13px;line-height:1.8;color:#3b4652}
.log span{color:var(--muted);margin-right:6px}
.sub{border-left:4px solid var(--line);padding:6px 10px;margin:8px 0;background:#f7f9fb;border-radius:0 8px 8px 0;font-size:14px}
.sub.fix{border-left-color:var(--check)}.sub.ok{border-left-color:var(--done)}.sub.ng{border-left-color:var(--wait)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column}
.viewer img{max-width:100%;max-height:calc(100% - 70px)}
.viewer .vb{position:absolute;bottom:16px;display:flex;gap:10px}
.draw{position:fixed;inset:0;background:#111;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center}
.draw canvas{touch-action:none;max-width:100%;max-height:calc(100% - 80px);background:#000}
.draw .vb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:70;font-size:14px;max-width:90%;text-align:center}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.login{max-width:380px;margin:30px auto}
.user-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.user-row:last-child{border-bottom:0}
.hl{animation:hl 2s}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px #f59f00}}
/* 通知單 */
.notice{background:#fff;padding:24px 22px;margin-bottom:16px;font-size:14px;color:#000}
.notice h2{text-align:center;margin:0 0 4px;letter-spacing:6px;font-size:22px}
.notice .no{text-align:center;color:#333;margin-bottom:12px}
.notice table{width:100%;border-collapse:collapse}
.notice td,.notice th{border:1px solid #333;padding:6px 8px;vertical-align:top;text-align:left}
.notice th{background:#eef1f5;width:86px;white-space:nowrap}
.notice .pics{display:flex;flex-wrap:wrap;gap:6px}
.notice .pics img{width:180px;height:135px;object-fit:cover;border:1px solid #999}
.notice .sign th{text-align:center;width:25%}
.notice .sign td{height:60px}
.notice .foot{font-size:12px;color:#333;margin-top:8px;line-height:1.6}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;padding:0}
  main{max-width:none;padding:0}
  .notice{padding:0;margin:0;page-break-after:always}
  .notice:last-child{page-break-after:auto}
  .notice th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <button id="backBtn" onclick="goBack()" style="display:none">‹ 返回</button>
  <h1 id="title">缺失改善系統</h1>
  <span id="sync" onclick="syncNow()"></span>
  <button id="hdrRight" style="display:none"></button>
</header>
<main id="app"></main>
<nav id="nav" style="display:none"></nav>
<div id="layer"></div>

<script src="data.js"></script>
<script src="pdf.js"></script>
<script>
'use strict';
const VERSION = 'v20';
// 後端網址（Google Apps Script 網頁應用程式）
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbw6hJC78rNUJjAZUvaN8ylKUuTXpjKQ4LGHtv83mAXuLJWLil1WrXy1ZIkUci63kqAAIA/exec';

// ── 小工具 ─────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 放進 onclick="…" 裡的字串參數（含引號的工項名稱也不會壞掉）
const jsq = s => esc(JSON.stringify(String(s)));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const md = s => s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : '';
const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);
let toastT;
function toast(m) {
  clearTimeout(toastT);
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = m;
  toastT = setTimeout(() => el.remove(), 3000);
}

const ST = { wait: '待改善', doing: '改善中', check: '待複查', done: '已結案' };
const OPEN = s => s !== 'done';
const isLate = d => (d.status === 'wait' || d.status === 'doing') && d.due < today();
const locText = d => [d.bldg, d.floor, d.spot].filter(Boolean).join(' ');
const noText = d => d.no ? '#' + String(d.no).padStart(4, '0') : '（未上傳）';
const stTag = d => `<span class="tag s-${d.status}">${ST[d.status]}</span>`;
const catTag = c => `<span class="tag c-${esc(c)}">${esc(c)}</span>`;
function dueText(d, bare) {
  const L = bare ? '' : '期限 ';
  if (!OPEN(d.status)) return L + md(d.due);
  const n = daysBetween(today(), d.due);
  if (isLate(d)) return `<span class="red">${L}${md(d.due)}，已逾 ${-n} 天</span>`;
  return L + md(d.due) + (d.status === 'check' ? '' : n === 0 ? '（今天）' : `（剩 ${n} 天）`);
}

// 本機測試可用 ?api=網址 改連模擬後端
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const QS = new URLSearchParams(location.search);
if (QS.get('api') && LOCAL) localStorage.setItem('dfi_api', QS.get('api'));
// 使用方式：solo＝單機（資料只在這支手機）、cloud＝登入公司系統；第一次打開時選
if (!localStorage.getItem('dfi_mode') && localStorage.getItem('dfi_auth')) localStorage.setItem('dfi_mode', 'cloud');   // 舊使用者
const MODE = localStorage.getItem('dfi_mode') || '';
const SOLO = MODE === 'solo';
const API = SOLO ? 'solo' : (LOCAL && localStorage.getItem('dfi_api')) || API_DEFAULT;
function setMode(m) {
  if (m === MODE) return;
  if (!SOLO && auth && pendingCount() && !confirm(`還有 ${pendingCount()} 筆資料沒上傳到公司系統，切換會丟掉。確定切換？`)) return;
  localStorage.setItem('dfi_mode', m); localStorage.removeItem('dfi_auth'); localStorage.removeItem('dfi_draft'); localStorage.removeItem('dfi_last'); localStorage.removeItem('dfi_pid');
  location.reload();
}
const VCODE = QS.get('v');   // 廠商回報連結
const BASE = location.origin + location.pathname.replace(/index\.html$/, '');

// ── 本機暫存（IndexedDB）─────────
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('defect-improvement', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('photos'); r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idbPut(store, key, val) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbDel(store, key) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).delete(key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbClear(store) {
  const d = await db();
  return new Promise((res, rej) => {
    const t = d.transaction(store, 'readwrite'), os = t.objectStore(store), c = os.count();
    let n = 0; c.onsuccess = () => { n = c.result; os.clear(); };
    t.oncomplete = () => res(n); t.onerror = () => rej(t.error);
  });
}
async function idbKeys(store) {
  const d = await db();
  return new Promise(res => { const r = d.transaction(store).objectStore(store).getAllKeys(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); });
}
async function idbGet(store, key) {
  const d = await db();
  return new Promise(res => { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
}

// ── 照片 ─────────────────────────────
const photoCache = {}, fetchingPh = new Set();
async function photoGet(id) {
  if (!photoCache[id]) photoCache[id] = await idbGet('photos', id);
  return photoCache[id];
}
async function photoPut(id, data) { photoCache[id] = data; await idbPut('photos', id, data); }
const imgTag = id => `<img data-pid="${esc(id)}" alt="">`;
const phView = id => `<div class="ph" onclick="viewPhoto('${esc(id)}')">${imgTag(id)}</div>`;
// 畫面上的 <img data-pid> 補上照片：先找手機暫存，沒有再跟後端拿
async function hydratePhotos(root) {
  const need = [];
  for (const img of (root || document).querySelectorAll('img[data-pid]')) {
    const id = img.dataset.pid, data = await photoGet(id);
    if (data) img.src = data;
    else if (!fetchingPh.has(id) && !need.includes(id)) need.push(id);
  }
  if (!need.length || !auth) return;
  need.forEach(id => fetchingPh.add(id));
  for (let i = 0; i < need.length; i += 8) {
    try {
      const ids = need.slice(i, i + 8);
      const r = await api('getPhotos', { ids });
      for (const [id, data] of Object.entries(r.photos)) {
        await photoPut(id, data);
        document.querySelectorAll(`img[data-pid="${id}"]`).forEach(im => { im.src = data; });
      }
    } catch (e) { break; }
  }
  need.forEach(id => fetchingPh.delete(id));
}
// 壓縮照片：長邊 1280px、JPEG 品質 0.7
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('讀不到照片')); };
    im.src = url;
  });
}
// 加照片的按鈕（拍照／相簿）。onAdd(id) 每張照片存好後呼叫
function photoAdders(key) {
  return `<label class="addph"><b>📷</b>拍照<input type="file" accept="image/*" capture="environment" onchange="addPhotos(this,'${key}')"></label>
    <label class="addph"><b>🖼</b>相簿<input type="file" accept="image/*" multiple onchange="addPhotos(this,'${key}')"></label>`;
}
const photoTargets = {};
async function addPhotos(input, key) {
  const files = Array.from(input.files || []);
  input.value = '';
  for (const f of files) {
    try {
      const data = await compress(f), id = uid();
      await photoPut(id, data);
      photoTargets[key](id);
    } catch (e) { toast(e.message); }
  }
}
function viewPhoto(id, onDraw) {
  const L = $('layer');
  L.innerHTML = `<div class="viewer" onclick="if(event.target===this||event.target.tagName==='IMG')closeLayer()">${imgTag(id)}
    <div class="vb">${onDraw ? '<button class="btn line" id="drawBtn">✏️ 畫圈標示</button>' : ''}<button class="btn ghost" onclick="savePhoto('${esc(id)}')">⬇ 存到手機</button><button class="btn ghost" onclick="closeLayer()">關閉</button></div></div>`;
  hydratePhotos(L); armHistory();
  if (onDraw) $('drawBtn').onclick = () => annotate(id, onDraw);
}
function closeLayer() { $('layer').innerHTML = ''; armHistory(); }
// 需要的時候才把照片存到手機（手機能分享就用分享，iPhone 選「儲存影像」；不能就下載）
async function savePhoto(id) {
  const data = await photoGet(id);
  if (!data) { toast('照片還沒載入，等一下再按'); return; }
  const blob = await (await fetch(data)).blob(), name = '缺失照片_' + ymd(new Date()).replace(/-/g, '') + '_' + id.slice(-5) + '.jpg';
  const file = new File([blob], name, { type: 'image/jpeg' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try { await navigator.share({ files: [file] }); } catch (e) { if (e.name !== 'AbortError') toast(e.message); }
    return;
  }
  const a = document.createElement('a'); a.href = URL.createObjectURL(file); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
// 在照片上畫圈：畫好存成一張新照片
async function annotate(id, done) {
  const data = await photoGet(id);
  if (!data) { toast('照片還沒載入'); return; }
  const im = new Image();
  im.onload = () => {
    const L = $('layer');
    L.innerHTML = `<div class="draw"><canvas id="cv"></canvas><div class="vb">
      <button class="btn ghost small" id="dUndo">↶ 復原</button><button class="btn ghost small" id="dCancel">取消</button>
      <button class="btn ok small" id="dOk">完成</button></div><div class="muted" style="color:#ccc;margin-top:6px">用手指在照片上圈出缺失位置</div></div>`;
    const cv = $('cv'), ctx = cv.getContext('2d');
    cv.width = im.width; cv.height = im.height;
    const strokes = [];
    let cur = null;
    const redraw = () => {
      ctx.drawImage(im, 0, 0);
      ctx.strokeStyle = '#ff2020'; ctx.lineWidth = Math.max(4, im.width / 160); ctx.lineCap = ctx.lineJoin = 'round';
      strokes.forEach(s => { ctx.beginPath(); s.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); });
    };

    try { const r = await api('getPhotos', { ids }); for (const [id, data] of Object.entries(r.photos)) await photoPut(id, data); lost += ids.filter(id => !r.photos[id]).length; }

  const bytes = await NoticePdf.make(ds, { projectName: id => (state.projects.find(p => p.id === id) || {}).name || '', vendorName: id => (vendorOf(id) || {}).name || '', photo: photoGet });

function delDefect(id) {

// ── PDF／Excel：產生檔案 → 直接分享檔案到 LINE，或下載（不傳網頁連結）─────
let lastExport = null;
async function exportShare(kind, ids, title) {
  const pend = ids.filter(id => !state.defects[id] || !state.defects[id].v || isPending(id));
  if (pend.length) { toast('有缺失還沒上傳，上傳後再匯出'); syncNow(); return; }
  if (ids.length > 40) { toast('一次最多 40 筆，請先篩選'); return; }
  sheet(`<div class="empty">正在產生 ${kind === 'pdf' ? 'PDF' : 'Excel'}（${ids.length} 筆）…</div>`);
  try {
    let file;
    if (kind === 'pdf') file = await localPdf(ids, title);
    else {
      const r = await api('exportFile', { kind, ids, title, withData: true });
      const bin = atob(r.data), u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      file = new File([u8], r.name, { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    }
    const r = { name: file.name };
    const lines = [`【缺失改善${kind === 'pdf' ? '通知單' : '清單'}】${title || ''}`, `共 ${ids.length} 筆，請查收`];
    lastExport = { file, url: URL.createObjectURL(file), name: r.name, text: lines.join('\n') };
    const canFile = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    sheet(`<h3>${kind === 'pdf' ? '📄 PDF' : '📊 Excel'} 做好了</h3><div class="muted" style="word-break:break-all">${esc(r.name)}</div>
      ${canFile ? '<button class="btn line block" onclick="shareFile()">傳到 LINE（附檔案）</button><div class="muted">按了會跳出分享，選 LINE → 選廠商的聊天室。</div>' : ''}
      <a class="btn ${canFile ? 'ghost' : ''} block" href="${lastExport.url}" download="${esc(r.name)}">下載／列印</a>
      <button class="btn ghost block" onclick="closeLayer()">關閉</button>
`);
  } catch (e) { closeLayer(); toast(e.message); }
}
async function shareFile() {
  try { await navigator.share({ files: [lastExport.file], text: lastExport.text }); }
  catch (e) { if (e.name !== 'AbortError') toast('這支手機不能直接分享檔案，請按「下載／列印」存下來再傳'); }
}

function togPid(id) { const a = vEdit.pids, i = a.indexOf(id); if (i < 0) a.push(id); else a.splice(i, 1); drawVendorSheet(); }

function otherVendors() { const p = curP(); return p ? state.vendors.filter(v => !v.disabled && !inProj(v, p.id)) : []; }
function pickOtherVendor() {
  const p = curP(), vs = otherVendors(), fromDraft = !!(vEdit && vEdit._fromDraft);
  sheet(`<h3>加入「${esc(p.name)}」</h3><div class="muted">點一家廠商就會加入這個建案，連結跟原本的一樣。</div>
    ${CATS.map(c => { const g = vs.filter(v => v.cat === c); return g.length ? `<div class="group-h" style="margin-top:12px">${catTag(c)}</div>${g.map(v => `<div class="user-row" onclick="joinProject('${v.id}',${fromDraft})"><div class="grow"><b>${esc(v.name)}</b><div class="muted">${esc(v.trades.join('、') || '—')}｜${esc(state.projects.filter(x => inProj(v, x.id)).map(x => x.name).join('、') || '沒有建案')}</div></div>＋</div>`).join('')}` : ''; }).join('')}
    <button class="btn ghost block" onclick="closeLayer();if(view.name==='edit')render()">取消</button>`);
}
function joinProject(id, fromDraft) {
  vEdit = clone(vendorOf(id));
  vEdit._base = (vEdit.pids || []).slice();
  vEdit.pids = vEdit._base.concat([curP().id]);
  vEdit._fromDraft = fromDraft;
  saveVendor();
}
function togTrade(t) { const a = vEdit.trades, i = a.indexOf(t); if (i < 0) a.push(t); else a.splice(i, 1); drawVendorSheet(); }
async function saveVendor() {
  const v = vEdit;
  if (!v.name.trim()) { toast('請填廠商名稱'); return; }
  const b = $('vSave'); if (b) b.disabled = true;
  try {
    const r = await api('saveVendor', { vendor: { id: v.id, name: v.name.trim(), cat: v.cat, trades: v.trades, contact: v.contact, phone: v.phone, disabled: v.disabled, pids: v.pids || [], basePids: v._base || undefined } });
    const i = state.vendors.findIndex(x => x.id === v.id);
    if (i >= 0) state.vendors[i] = r.vendor; else state.vendors.push(r.vendor);
    persistNow(); closeLayer();
    if (v._fromDraft && draft && inProj(r.vendor, draft.pid)) {
      // 開單時新建的廠商：分類跟著廠商；從全部廠商挑的：保留原本選的分類和工項
      if (v._new && draft.cat !== v.cat) { draft.cat = v.cat; if (!Object.keys(TRADES[v.cat] || {}).includes(draft.trade)) draft.trade = ''; }
      draft.vid = v.id; keepDraft();
    }
    if (!v._quiet) toast('廠商已存');
    render();
  } catch (e) { if (!v._quiet) toast(e.message.includes('網路') ? '新增廠商要有網路' : e.message); if (b) b.disabled = false; }
}
// 刪除廠商：這個建案還有未結案 → 先改派；有缺失紀錄或在別的建案 → 只從這個建案移除；都沒有 → 整個刪掉
async function delVendor(id) {
  const v = vendorOf(id), p = curP();
  if (!v) return;
  const open = projDefects().filter(d => d.vid === id && OPEN(d.status)).length;
  if (open) { toast(`「${v.name}」在這個建案還有 ${open} 筆未結案，先把缺失改派給別家再刪`); return; }
  const used = Object.values(state.defects).some(d => d.vid === id);
  const otherP = (v.pids || []).filter(x => !p || x !== p.id);
  if (p && inProj(v, p.id) && (used || otherP.length)) {
    if (!confirm(`把「${v.name}」從「${p.name}」移除？
${otherP.length ? '其他建案還會用到這家，' : ''}舊的缺失紀錄會保留廠商名稱。`)) return;
    vEdit = clone(v); vEdit._base = (v.pids || []).slice(); vEdit.pids = vEdit._base.filter(x => x !== p.id); vEdit._quiet = true;
    await saveVendor();
    toast('已從這個建案移除');
  } else {
    if (used) { toast(`「${v.name}」有缺失紀錄，不能整個刪除${isAdmin() ? '，可以在修改裡勾「停用」' : '，請後台停用'}`); return; }
    if (!confirm(`刪除廠商「${v.name}」？刪了就不能復原。`)) return;
    try { await api('deleteVendor', { id }); }
    catch (e) { toast(e.message); return; }
    state.vendors = state.vendors.filter(x => x.id !== id);
    persistNow(); closeLayer(); toast('已刪除');
  }
  if (view.name === 'vendor' && view.id === id) goBack(); else render();
}

    ${isAdmin() ? `<div class="card"><h3>後台管理</h3>
      <button class="btn ghost block" onclick="go({name:'projects'})">🏗 建案管理</button>
      <button class="btn ghost block" onclick="go({name:'users'})">👤 帳號管理</button>
      <button class="btn ghost block" style="color:#c92a2a" onclick="resetData()">🧹 測試資料歸零</button></div>` : ''}
    <div class="card"><h3>資料</h3><div class="muted">還沒上傳：${pendingCount()} 筆　${syncErr ? '（' + esc(syncErr) + '）' : ''}</div>
      <button class="btn ghost block" onclick="syncNow().then(()=>pull())">立即同步</button></div>
    <div class="ver">小棒槌 缺失改善系統 ${VERSION}${LOCAL ? '<br>後端：' + esc(API) : ''}</div>`;
};
function changePass() {
  sheet(`<h3>改密碼</h3><label class="f">舊密碼</label><input type="password" id="po"><label class="f">新密碼（至少 6 個字）</label><input type="password" id="pn">
    <button class="btn block" onclick="doChangePass(this)">確定</button><button class="btn ghost block" onclick="closeLayer()">取消</button>`);
}
async function doChangePass(b) {

  try { setAuth(await api('changePass', { old: $('po').value, pass: $('pn').value })); closeLayer(); toast('密碼已更改'); }

VIEWS.projects = () => {
  hdr('建案管理', { right: ['＋ 新增', () => editProject(null)] });
  return `<div class="card">${state.projects.map(p => `<div class="user-row" onclick="editProject('${p.id}')"><b class="grow">${esc(p.name)}</b>${p.disabled ? '<span class="tag pend">停用</span>' : ''}<span class="muted">${Object.values(state.defects).filter(d => d.pid === p.id).length} 件</span></div>`).join('') || '<div class="muted">還沒有建案</div>'}</div>
    <button class="btn block" onclick="editProject(null)">＋ 新增建案</button>`;
};
// 建案的位置規劃（開單時「位置」都用點的，不用打字）
const LOC_DEF = { b: 1, n: 5, r: 1, bldgs: [], floorsX: [],
  struct: ['柱', '樑', '版', '牆', '樓梯', '基礎', '電梯井', '女兒牆'],
  units: ['A戶', 'B戶', '梯廳', '走道', '樓梯間'],
  rooms: ['客廳', '餐廳', '廚房', '主臥', '次臥', '浴室', '陽台', '玄關'],
  outer: ['東向外牆', '西向外牆', '南向外牆', '北向外牆', '屋頂', '中庭', '車道', '大門', '圍牆'] };
const splitList = s => [...new Set(String(s || '').split(/[、,，;；\s]+/).map(x => x.trim()).filter(Boolean))];
function floorsOf(l) {
  const a = [];
  for (let i = l.b || 0; i >= 1; i--) a.push('B' + i);
  for (let i = 1; i <= (l.n || 0); i++) a.push(i + 'F');
  for (let i = 1; i <= (l.r || 0); i++) a.push('R' + i + 'F');
  return a.concat((l.floorsX || []).filter(x => !a.includes(x)));
}
function editProject(id) {
  const p = id ? state.projects.find(x => x.id === id) : null, l = (p && p.loc) || LOC_DEF;
  const txt = (k, label, hint) => `<label class="f">${label}</label><textarea id="pl_${k}" rows="2" style="min-height:0" placeholder="${esc(hint)}">${esc((l[k] || []).join('、'))}</textarea>`;
  const num = (k, label) => `<label style="flex:1;font-size:14px;min-width:0">${label}<input type="number" inputmode="numeric" id="pl_${k}" min="0" max="80" value="${l[k] || 0}" style="display:block;width:100%;margin-top:2px"></label>`;
  sheet(`<h3>${p ? '修改建案' : '新增建案'}</h3><label class="f">建案名稱</label><input type="text" id="pjn" value="${esc(p ? p.name : '')}">
    <h3 style="margin-top:16px">位置規劃（開單時用點的）</h3>
    ${p && !p.loc ? '<div class="muted" style="color:#e8590c">這個建案還沒設定，下面是預設值，改好按儲存。</div>' : ''}
    <div class="muted">多個項目用「、」或空白分開。</div>
    ${txt('bldgs', '棟別（只有一棟就空白，開單時不會出現）', '例如：A、B、C')}
    <label class="f">樓層</label><div class="row">${num('b', '地下幾層')}${num('n', '地上幾層')}${num('r', '屋突幾層')}</div>
    ${txt('floorsX', '另外的樓層（可不填）', '例如：夾層、機房層')}
    ${txt('struct', '結構體的位置', '柱、樑、版、牆')}
    ${txt('units', '室內裝修：戶別／公設', '例如：A戶、B戶、梯廳')}
    ${txt('rooms', '室內裝修：空間（開單時可不選）', '客廳、主臥、浴室')}
    ${txt('outer', '室外裝修的位置', '東向外牆、屋頂')}
    ${p ? `<label style="display:block;margin-top:12px"><input type="checkbox" id="pjd" ${p.disabled ? 'checked' : ''}> 停用（完工的建案，不再出現在選單）</label>` : ''}
    <button class="btn block" onclick="saveProject('${p ? p.id : ''}',this)">儲存</button><button class="btn ghost block" onclick="closeLayer()">取消</button>`);
}
async function saveProject(id, b) {
  b.disabled = true;
  const loc = { b: +$('pl_b').value || 0, n: +$('pl_n').value || 0, r: +$('pl_r').value || 0 };
  ['bldgs', 'floorsX', 'struct', 'units', 'rooms', 'outer'].forEach(k => { loc[k] = splitList($('pl_' + k).value); });
  const p = { id: id || uid(), name: $('pjn').value.trim(), disabled: !!($('pjd') && $('pjd').checked), loc };
  try {
    const r = await api('saveProject', { project: p });
    p.loc = r.loc;
    const i = state.projects.findIndex(x => x.id === p.id);
    if (i >= 0) state.projects[i] = p; else { state.projects.push(p); localStorage.setItem('dfi_pid', p.id); }
    persistNow(); closeLayer(); render(); toast('已儲存');
  } catch (e) { toast(e.message); b.disabled = false; }
}
// ── 測試完歸零（後台）──
function resetData() {
  sheet(`<h3>🧹 ${SOLO ? '資料歸零' : '測試資料歸零'}</h3>
    <div class="muted">${SOLO ? '清掉的資料不能復原（照片也會刪掉），要的話先備份。' : '清掉的資料不能復原（照片會丟到雲端硬碟垃圾桶，30 天內還能救）。帳號都會留著。'}</div>
    <label style="display:block;margin-top:12px"><input type="radio" name="rsm" value="defects" checked> 只清<b>缺失</b>（建案、廠商留著）</label>
    <label style="display:block;margin-top:8px"><input type="radio" name="rsm" value="all"> 全部清：缺失＋<b>建案、廠商</b>、自己加的工項／常用語</label>
    <label class="f">確定的話，打「歸零」兩個字</label><input type="text" id="rsc">
    <button class="btn block" style="background:#c92a2a" onclick="doReset(this)">清除</button><button class="btn ghost block" onclick="closeLayer()">取消</button>`);
}
// ── 單機版：備份／還原 ──
async function soloBackup() {
  try {
    await syncNow();
    const o = await SoloBackend.backup(), at = new Date();
    const name = '缺失改善備份_' + ymd(at).replace(/-/g, '') + '.json';
    const file = new File([JSON.stringify(o)], name, { type: 'application/json' });
    lastExport = { file, url: URL.createObjectURL(file), name, text: '缺失改善系統備份 ' + ymd(at) };
    const n = Object.keys(o.photos).length, mb = (file.size / 1048576).toFixed(1);
    const canFile = !!(navigator.canShare && navigator.canShare({ files: [file] }));
    sheet(`<h3>📦 備份檔做好了</h3><div class="muted">${esc(name)}（${mb} MB，照片 ${n} 張）</div>
      <div class="muted" style="margin-top:6px">存到手機以外的地方才安全：傳到 LINE「Keep 筆記」或自己的聊天室、存到雲端硬碟都可以。</div>
      ${canFile ? '<button class="btn line block" onclick="shareBackup()">分享／存到別的地方</button>' : ''}
      <a class="btn ${canFile ? 'ghost' : ''} block" href="${lastExport.url}" download="${esc(name)}" onclick="markBackup()">下載備份檔</a>
      <button class="btn ghost block" onclick="closeLayer()">關閉</button>`);
  } catch (e) { toast(e.message); }
}
function markBackup() { localStorage.setItem('dfi_lastBackup', new Date().toISOString()); }
async function shareBackup() {
  try { await navigator.share({ files: [lastExport.file], title: lastExport.name }); markBackup(); toast('已備份'); closeLayer(); render(); }
  catch (e) { if (e.name !== 'AbortError') toast('不能分享，請按「下載備份檔」'); }
}
async function soloRestore(f) {
  if (!f) return;
  try {
    const o = JSON.parse(await f.text());
    if (!confirm(`用這個備份檔（${String(o.at || '').slice(0, 10)}）還原？\n這支手機現在的資料會被蓋掉。`)) return;
    await soloReady();
    await SoloBackend.restore(o);
    await idbDel('kv', CK); await idbDel('kv', OK);
    localStorage.removeItem('dfi_draft');
    toast('已還原'); setTimeout(() => location.reload(), 600);
  } catch (e) { toast(e.message.includes('JSON') ? '這不是缺失改善系統的備份檔' : e.message); }
}
async function doReset(b) {
  const mode = document.querySelector('input[name=rsm]:checked').value, c = $('rsc').value.trim();
  if (c !== '歸零') { toast('請打「歸零」'); return; }
  b.disabled = true;
  try {
    const r = await api('resetData', { mode, confirm: c });
    outbox = emptyBox(); state = emptyState();
    localStorage.removeItem('dfi_draft'); localStorage.removeItem('dfi_last');
    await persistNow(); await pull(true);
    closeLayer(); stack.length = 0; view = { name: 'start' }; render();
    toast(`已清除 ${r.defects} 筆缺失、${r.photos} 張照片`);
  } catch (e) { toast(e.message); b.disabled = false; }
}
let users = null;
VIEWS.users = () => {
  hdr('帳號管理', { right: ['＋ 新增', () => editUser(null)] });
  if (!users) { api('listUsers').then(r => { users = r.users; render(); }).catch(e => toast(e.message)); return '<div class="empty">讀取中…</div>'; }
  return `<div class="card">${users.map(u => `<div class="user-row" onclick="editUser(${jsq(u.user)})"><div class="grow"><b>${esc(u.name)}</b><div class="muted">${esc(u.user)}・${ROLE_NAME[u.role]}</div></div>${u.disabled ? '<span class="tag pend">停用</span>' : ''}</div>`).join('')}</div>
    <div class="muted">工地人員：可以開單、複查、新增廠商。後台：另外可以管理建案、帳號、修改已結案的缺失。</div>`;
};
function editUser(user) {
  const u = user ? users.find(x => x.user === user) : null;
  sheet(`<h3>${u ? '修改帳號' : '新增帳號'}</h3>
    <label class="f">帳號（登入用，英文、數字）</label><input type="text" id="uu" value="${esc(u ? u.user : '')}" data-old="${esc(u ? u.user : '')}" autocapitalize="off">
    ${u ? '<div class="muted">改了之後要用新帳號登入，密碼不變；他開過的單、加過的常用語會跟著改。</div>' : ''}
    <label class="f">姓名</label><input type="text" id="un" value="${esc(u ? u.name : '')}">
    <label class="f">角色</label><select id="ur"><option value="staff">工地人員</option><option value="admin" ${u && u.role === 'admin' ? 'selected' : ''}>後台</option></select>
    <label class="f">${u ? '重設密碼（不改就空白）' : '密碼（至少 6 個字）'}</label><input type="password" id="up" autocomplete="new-password">
    ${u ? `<label style="display:block;margin-top:12px"><input type="checkbox" id="ud" ${u.disabled ? 'checked' : ''}> 停用這個帳號</label>` : ''}
    <button class="btn block" onclick="saveUser(${u ? 'false' : 'true'},this)">儲存</button><button class="btn ghost block" onclick="closeLayer()">取消</button>`);
}
async function saveUser(isNew, b) {
  b.disabled = true;
  try {
    const old = $('uu').dataset.old, nu = $('uu').value.trim().toLowerCase();
    if (!isNew && nu !== old && !confirm(`帳號「${old}」改成「${nu}」？之後要用新帳號登入。`)) { b.disabled = false; return; }
    const r = await api('saveUser', { isNew, user: isNew ? nu : old, newUser: isNew ? undefined : nu, name: $('un').value, role: $('ur').value, pass: $('up').value || undefined, disabled: !!($('ud') && $('ud').checked) });
    if (r.token) setAuth(r);   // 改的是自己：換成新的登入
    users = null; closeLayer(); render(); toast('已儲存');
  } catch (e) { toast(e.message); b.disabled = false; }
}

// ══ 舊的廠商回報連結（?v=）：功能已停用，只顯示說明 ══
function renderVendorPortal() {
  $('backBtn').style.display = 'none'; $('nav').style.display = 'none';
  $('title').textContent = '缺失改善';
  $('app').innerHTML = '<div class="card login"><h3>這個連結已停用</h3><p class="muted">缺失改善通知改用 PDF 傳送，改善完成請直接通知工地人員複查。</p></div>';
}

// ── 啟動 ─────────────────────────────
(async () => {
  if (VCODE) { render(); return; }
  // 單機版用過了（切回來、或登入資料不見）：直接進去，不用再填名字
  if (SOLO && !auth) { try { setAuth(await api('soloAuth', {})); } catch (e) {} }
  if (SOLO && auth) {
    const saved = await idbGet('kv', CK), box = await idbGet('kv', OK);
    if (saved) state = saved;
    if (box) { outbox = box; seq = Math.max(0, ...Object.values(outbox.d)); }
    fixLoaded();
    if (localStorage.getItem('dfi_draft')) { stack.push({ name: 'home' }); view = { name: 'edit' }; startDraft(null); }
    render();
    soloStart(true).then(() => { if (pendingCount()) sync(); });
  } else if (auth) {
    const saved = await idbGet('kv', CK), box = await idbGet('kv', OK);
    if (saved) state = saved;
    if (box) { outbox = box; seq = Math.max(0, ...Object.values(outbox.d)); }
    fixLoaded(); migrateLocalCustoms();
    // 有沒存完的新缺失 → 直接回到新增畫面
    if (localStorage.getItem('dfi_draft')) { stack.push({ name: 'home' }); view = { name: 'edit' }; startDraft(null); }
    render();
    pull(true);
  } else render();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
