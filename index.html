<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>小棒槌 缺失改善系統</title>
<meta name="theme-color" content="#1f3a5f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#eef2f7; --card:#fff; --ink:#16202c; --muted:#627080; --line:#d9e1ea; --steel:#1f3a5f;
  --wait:#d64545; --doing:#e08a1e; --check:#2b7bd6; --done:#2f9e5b;
  --c1:#6b4fa0; --c2:#2b7bd6; --c3:#2f9e5b; --line-green:#06c755;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;font-size:16px;line-height:1.5;padding-bottom:84px}
header{position:sticky;top:0;z-index:10;background:var(--steel);color:#fff;padding:10px 12px;padding-top:max(10px,env(safe-area-inset-top));display:flex;align-items:center;gap:8px}
header h1{font-size:18px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
header h1.pick{cursor:pointer}
header button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:8px;padding:6px 10px;font-size:15px;font-family:inherit}
#sync{font-size:12px;opacity:.9;white-space:nowrap;cursor:pointer}
main{max-width:760px;margin:0 auto;padding:12px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;border:0;background:none;padding:6px 0 8px;font-size:12px;color:var(--muted);font-family:inherit;position:relative}
nav button b{display:block;font-size:21px;line-height:1.3}
nav button.on{color:var(--steel);font-weight:bold}
nav i{position:absolute;top:2px;left:55%;background:var(--wait);color:#fff;font-style:normal;font-size:11px;border-radius:9px;padding:0 5px;min-width:18px}
.card{background:var(--card);border-radius:12px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h3{margin:0 0 8px;font-size:16px;color:var(--steel)}
.muted{color:var(--muted);font-size:14px}
.btn{display:inline-block;border:0;border-radius:10px;padding:10px 16px;font-size:16px;background:var(--steel);color:#fff;cursor:pointer;font-family:inherit;text-align:center}
.btn.line{background:var(--line-green)}
.btn.ok{background:var(--done)}
.btn.ng{background:var(--wait)}
.btn.ghost{background:#fff;color:var(--steel);border:1px solid var(--line)}
.btn.small{padding:6px 10px;font-size:14px}
.btn.block{display:block;width:100%;margin-top:8px}
.btn:disabled{opacity:.5}
.row{display:flex;gap:8px;align-items:center}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
label.f{display:block;margin:12px 0 4px;font-size:14px;color:#3b4652;font-weight:bold}
input[type=text],input[type=date],input[type=tel],input[type=password],input[type=search],textarea,select{width:100%;padding:10px;border:1px solid var(--line);border-radius:8px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:70px;resize:vertical}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fff;border-radius:16px;padding:5px 12px;font-size:14px;font-family:inherit;color:var(--ink);cursor:pointer}
.chip.on{background:var(--steel);border-color:var(--steel);color:#fff}
.chip.add{border-style:dashed;color:var(--muted)}
.tag{display:inline-block;font-size:12px;padding:1px 8px;border-radius:10px;color:#fff;margin-right:4px;white-space:nowrap;vertical-align:middle}
.s-wait{background:var(--wait)}.s-doing{background:var(--doing)}.s-check{background:var(--check)}.s-done{background:var(--done)}
.c-結構體{background:var(--c1)}.c-室內裝修{background:var(--c2)}.c-室外裝修{background:var(--c3)}
.tag.pend{background:#868e96}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:12px}
.stats button{border:0;border-radius:10px;color:#fff;padding:10px 2px;font-family:inherit;cursor:pointer}
.stats b{display:block;font-size:26px;line-height:1.2}
.stats span{font-size:13px}
.item{display:flex;gap:10px;align-items:flex-start;cursor:pointer;background:#fff;border-radius:12px;padding:10px;margin-bottom:8px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.item.late{box-shadow:inset 4px 0 0 var(--wait),0 1px 3px rgba(0,0,0,.06)}
.thumb{width:66px;height:66px;border-radius:8px;background:#dfe5ec;flex:none;overflow:hidden;display:flex;align-items:center;justify-content:center;color:#8a96a3;font-size:24px}
.thumb img{width:100%;height:100%;object-fit:cover}
.it-t{font-weight:bold;font-size:15px}
.it-m{font-size:13px;color:var(--muted);margin-top:2px}
.red{color:var(--wait);font-weight:bold}
.bar{display:flex;align-items:center;gap:8px;font-size:14px;padding:6px 0;cursor:pointer}
.bar .n{width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .b{flex:1;height:10px;background:#eef1f5;border-radius:5px;overflow:hidden}
.bar .b i{display:block;height:100%}
.bar .c{width:70px;text-align:right;color:var(--muted);font-size:13px}
.photos{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px}
.ph{position:relative;width:80px;height:80px;border-radius:8px;overflow:hidden;background:#dfe5ec;cursor:pointer}
.ph img{width:100%;height:100%;object-fit:cover}
.ph .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.6);color:#fff;border:0;border-radius:50%;width:24px;height:24px;font-size:13px;line-height:24px;padding:0}
.addph{width:80px;height:80px;border:2px dashed #b7c0cc;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-direction:column;font-size:13px;color:var(--muted);cursor:pointer;background:#fff}
.addph b{font-size:22px;line-height:1.1}
.addph input{display:none}
.kv{width:100%;border-collapse:collapse;font-size:15px}
.kv th{width:84px;text-align:left;color:var(--muted);font-weight:normal;padding:5px 0;vertical-align:top}
.kv td{padding:5px 0}
.log{font-size:13px;line-height:1.8;color:#3b4652}
.log span{color:var(--muted);margin-right:6px}
.sub{border-left:4px solid var(--line);padding:6px 10px;margin:8px 0;background:#f7f9fb;border-radius:0 8px 8px 0;font-size:14px}
.sub.fix{border-left-color:var(--check)}.sub.ok{border-left-color:var(--done)}.sub.ng{border-left-color:var(--wait)}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.modal .sheet{background:#fff;width:100%;max-width:760px;border-radius:16px 16px 0 0;padding:16px;max-height:88vh;overflow:auto;padding-bottom:max(16px,env(safe-area-inset-bottom))}
.viewer{position:fixed;inset:0;background:#000;z-index:60;display:flex;align-items:center;justify-content:center;flex-direction:column}
.viewer img{max-width:100%;max-height:calc(100% - 70px)}
.viewer .vb{position:absolute;bottom:16px;display:flex;gap:10px}
.draw{position:fixed;inset:0;background:#111;z-index:65;display:flex;flex-direction:column;align-items:center;justify-content:center}
.draw canvas{touch-action:none;max-width:100%;max-height:calc(100% - 80px);background:#000}
.draw .vb{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;justify-content:center}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#222;color:#fff;padding:8px 16px;border-radius:20px;z-index:70;font-size:14px;max-width:90%;text-align:center}
.ver{text-align:center;color:var(--muted);font-size:12px;margin-top:20px}
.login{max-width:380px;margin:30px auto}
.user-row{display:flex;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.user-row:last-child{border-bottom:0}
.hl{animation:hl 2s}
@keyframes hl{0%,40%{box-shadow:0 0 0 3px #f59f00}}
/* 通知單 */
.notice{background:#fff;padding:24px 22px;margin-bottom:16px;font-size:14px;color:#000}
.notice h2{text-align:center;margin:0 0 4px;letter-spacing:6px;font-size:22px}
.notice .no{text-align:center;color:#333;margin-bottom:12px}
.notice table{width:100%;border-collapse:collapse}
.notice td,.notice th{border:1px solid #333;padding:6px 8px;vertical-align:top;text-align:left}
.notice th{background:#eef1f5;width:86px;white-space:nowrap}
.notice .pics{display:flex;flex-wrap:wrap;gap:6px}
.notice .pics img{width:180px;height:135px;object-fit:cover;border:1px solid #999}
.notice .sign th{text-align:center;width:25%}
.notice .sign td{height:60px}
.notice .foot{font-size:12px;color:#333;margin-top:8px;line-height:1.6}
@media print{
  header,nav,.noprint{display:none!important}
  body{background:#fff;padding:0}
  main{max-width:none;padding:0}
  .notice{padding:0;margin:0;page-break-after:always}
  .notice:last-child{page-break-after:auto}
  .notice th{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<header>
  <button id="backBtn" onclick="goBack()" style="display:none">‹ 返回</button>
  <h1 id="title">缺失改善系統</h1>
  <span id="sync" onclick="syncNow()"></span>
  <button id="hdrRight" style="display:none"></button>
</header>
<main id="app"></main>
<nav id="nav" style="display:none"></nav>
<div id="layer"></div>

<script src="data.js"></script>
<script>
'use strict';
const VERSION = 'v6';
// 後端網址（Google Apps Script 網頁應用程式）
const API_DEFAULT = 'https://script.google.com/macros/s/AKfycbw6hJC78rNUJjAZUvaN8ylKUuTXpjKQ4LGHtv83mAXuLJWLil1WrXy1ZIkUci63kqAAIA/exec';

// ── 小工具 ─────────────────────────────
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
// 放進 onclick="…" 裡的字串參數（含引號的工項名稱也不會壞掉）
const jsq = s => esc(JSON.stringify(String(s)));
const ymd = d => d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
const today = () => ymd(new Date());
const addDays = n => { const d = new Date(); d.setDate(d.getDate() + n); return ymd(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00') - new Date(a + 'T00:00')) / 864e5);
const md = s => s ? Number(s.slice(5, 7)) + '/' + Number(s.slice(8, 10)) : '';
const clone = o => JSON.parse(JSON.stringify(o));
const $ = id => document.getElementById(id);
let toastT;
function toast(m) {
  clearTimeout(toastT);
  let el = document.querySelector('.toast');
  if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); }
  el.textContent = m;
  toastT = setTimeout(() => el.remove(), 3000);
}

const ST = { wait: '待改善', doing: '改善中', check: '待複查', done: '已結案' };
const OPEN = s => s !== 'done';
const isLate = d => (d.status === 'wait' || d.status === 'doing') && d.due < today();
const locText = d => [d.bldg, d.floor, d.spot].filter(Boolean).join(' ');
const noText = d => d.no ? '#' + String(d.no).padStart(4, '0') : '（未上傳）';
const stTag = d => `<span class="tag s-${d.status}">${ST[d.status]}</span>`;
const catTag = c => `<span class="tag c-${esc(c)}">${esc(c)}</span>`;
function dueText(d, bare) {
  const L = bare ? '' : '期限 ';
  if (!OPEN(d.status)) return L + md(d.due);
  const n = daysBetween(today(), d.due);
  if (isLate(d)) return `<span class="red">${L}${md(d.due)}，已逾 ${-n} 天</span>`;
  return L + md(d.due) + (d.status === 'check' ? '' : n === 0 ? '（今天）' : `（剩 ${n} 天）`);
}

// 本機測試可用 ?api=網址 改連模擬後端
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
const QS = new URLSearchParams(location.search);
if (QS.get('api') && LOCAL) localStorage.setItem('dfi_api', QS.get('api'));
const API = (LOCAL && localStorage.getItem('dfi_api')) || API_DEFAULT;
const VCODE = QS.get('v');   // 廠商回報連結
const BASE = location.origin + location.pathname.replace(/index\.html$/, '');

// ── 本機暫存（IndexedDB）─────────
let dbP = null;
function db() {
  if (!dbP) dbP = new Promise((res, rej) => {
    const r = indexedDB.open('defect-improvement', 1);
    r.onupgradeneeded = () => { r.result.createObjectStore('photos'); r.result.createObjectStore('kv'); };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return dbP;
}
async function idbPut(store, key, val) {
  const d = await db();
  return new Promise((res, rej) => { const t = d.transaction(store, 'readwrite'); t.objectStore(store).put(val, key); t.oncomplete = res; t.onerror = () => rej(t.error); });
}
async function idbGet(store, key) {
  const d = await db();
  return new Promise(res => { const r = d.transaction(store).objectStore(store).get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(null); });
}

// ── 照片 ─────────────────────────────
const photoCache = {}, fetchingPh = new Set();
async function photoGet(id) {
  if (!photoCache[id]) photoCache[id] = await idbGet('photos', id);
  return photoCache[id];
}
async function photoPut(id, data) { photoCache[id] = data; await idbPut('photos', id, data); }
const imgTag = id => `<img data-pid="${esc(id)}" alt="">`;
const phView = id => `<div class="ph" onclick="viewPhoto('${esc(id)}')">${imgTag(id)}</div>`;
// 畫面上的 <img data-pid> 補上照片：先找手機暫存，沒有再跟後端拿
async function hydratePhotos(root) {
  const need = [];
  for (const img of (root || document).querySelectorAll('img[data-pid]')) {
    const id = img.dataset.pid, data = await photoGet(id);
    if (data) img.src = data;
    else if (!fetchingPh.has(id) && !need.includes(id)) need.push(id);
  }
  if (!need.length || (!auth && !VCODE)) return;
  need.forEach(id => fetchingPh.add(id));
  for (let i = 0; i < need.length; i += 8) {
    try {
      const ids = need.slice(i, i + 8);
      const r = VCODE ? await api('vendorPhotos', { code: VCODE, ids }) : await api('getPhotos', { ids });
      for (const [id, data] of Object.entries(r.photos)) {
        await photoPut(id, data);
        document.querySelectorAll(`img[data-pid="${id}"]`).forEach(im => { im.src = data; });
      }
    } catch (e) { break; }
  }
  need.forEach(id => fetchingPh.delete(id));
}
// 壓縮照片：長邊 1280px、JPEG 品質 0.7
function compress(file) {
  return new Promise((res, rej) => {
    const url = URL.createObjectURL(file), im = new Image();
    im.onload = () => {
      const k = Math.min(1, 1280 / Math.max(im.width, im.height)), c = document.createElement('canvas');
      c.width = Math.round(im.width * k); c.height = Math.round(im.height * k);
      c.getContext('2d').drawImage(im, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.7));
    };
    im.onerror = () => { URL.revokeObjectURL(url); rej(new Error('讀不到照片')); };
    im.src = url;
  });
}
// 加照片的按鈕（拍照／相簿）。onAdd(id) 每張照片存好後呼叫
function photoAdders(key) {
  return `<label class="addph"><b>📷</b>拍照<input type="file" accept="image/*" capture="environment" onchange="addPhotos(this,'${key}')"></label>
    <label class="addph"><b>🖼</b>相簿<input type="file" accept="image/*" multiple onchange="addPhotos(this,'${key}')"></label>`;
}
const photoTargets = {};
async function addPhotos(input, key) {
  const files = Array.from(input.files || []);
  input.value = '';
  for (const f of files) {
    try {
      const data = await compress(f), id = uid();
      await photoPut(id, data);
      photoTargets[key](id);
    } catch (e) { toast(e.message); }
  }
}
function viewPhoto(id, onDraw) {
  const L = $('layer');
  L.innerHTML = `<div class="viewer" onclick="if(event.target===this||event.target.tagName==='IMG')closeLayer()">${imgTag(id)}
    <div class="vb">${onDraw ? '<button class="btn line" id="drawBtn">✏️ 畫圈標示</button>' : ''}<button class="btn ghost" onclick="closeLayer()">關閉</button></div></div>`;
  hydratePhotos(L); armHistory();
  if (onDraw) $('drawBtn').onclick = () => annotate(id, onDraw);
}
function closeLayer() { $('layer').innerHTML = ''; armHistory(); }
// 在照片上畫圈：畫好存成一張新照片
async function annotate(id, done) {
  const data = await photoGet(id);
  if (!data) { toast('照片還沒載入'); return; }
  const im = new Image();
  im.onload = () => {
    const L = $('layer');
    L.innerHTML = `<div class="draw"><canvas id="cv"></canvas><div class="vb">
      <button class="btn ghost small" id="dUndo">↶ 復原</button><button class="btn ghost small" id="dCancel">取消</button>
      <button class="btn ok small" id="dOk">完成</button></div><div class="muted" style="color:#ccc;margin-top:6px">用手指在照片上圈出缺失位置</div></div>`;
    const cv = $('cv'), ctx = cv.getContext('2d');
    cv.width = im.width; cv.height = im.height;
    const strokes = [];
    let cur = null;
    const redraw = () => {
      ctx.drawImage(im, 0, 0);
      ctx.strokeStyle = '#ff2020'; ctx.lineWidth = Math.max(4, im.width / 160); ctx.lineCap = ctx.lineJoin = 'round';
      strokes.forEach(s => { ctx.beginPath(); s.forEach((p, i) => (i ? ctx.lineTo(p[0], p[1]) : ctx.moveTo(p[0], p[1]))); ctx.stroke(); });
    };
    const pt = e => { const r = cv.getBoundingClientRect(); return [(e.clientX - r.left) * cv.width / r.width, (e.clientY - r.top) * cv.height / r.height]; };
    cv.onpointerdown = e => { cv.setPointerCapture(e.pointerId); cur = [pt(e)]; strokes.push(cur); redraw(); };
    cv.onpointermove = e => { if (cur) { cur.push(pt(e)); redraw(); } };
    cv.onpointerup = cv.onpointercancel = () => { cur = null; };
    $('dUndo').onclick = () => { strokes.pop(); redraw(); };
    $('dCancel').onclick = closeLayer;
    $('dOk').onclick = async () => {
      if (!strokes.length) { closeLayer(); return; }
      const nid = uid();
      await photoPut(nid, cv.toDataURL('image/jpeg', 0.75));
      closeLayer(); done(nid);
    };
    redraw();
  };
  im.src = data;
}
// 照片列：可刪、可點開、可畫圈
function photoRow(ids, key, editable) {
  return ids.map((id, i) => `<div class="ph" onclick="photoClick('${key}',${i})">${imgTag(id)}${editable ? `<button class="x" onclick="event.stopPropagation();photoDelete('${key}',${i})">✕</button>` : ''}</div>`).join('');
}
const photoLists = {};   // key → { get: () => 陣列, editable, changed }
function photoClick(key, i) {
  const P = photoLists[key], ids = P.get();
  viewPhoto(ids[i], P.editable ? nid => { ids[i] = nid; P.changed(); } : null);
}
function photoDelete(key, i) { const P = photoLists[key]; P.get().splice(i, 1); P.changed(); }

// ── 帳號與雲端 ─────────────────────────────
let auth = null;
try { auth = JSON.parse(localStorage.getItem('dfi_auth') || 'null'); } catch (e) {}
if (auth && auth.api !== API) auth = null;
const isAdmin = () => !!(auth && auth.me.role === 'admin');
const ROLE_NAME = { admin: '後台', staff: '工地人員' };
class ServerError extends Error {}
async function api(action, data) {
  if (!API) throw new ServerError('還沒設定後端網址');
  let res;
  try { res = await fetch(API, { method: 'POST', body: JSON.stringify(Object.assign({ action, token: auth && auth.token }, data || {})) }); }
  catch (e) { throw new Error('連不上網路'); }
  let j;
  try { j = await res.json(); } catch (e) { throw new Error('伺服器忙碌，稍後再試'); }
  if (j.auth) { if (!VCODE) logout(true); throw new ServerError(j.err || '請重新登入'); }
  if (!j.ok && !j.conflict && !j.gone) throw new ServerError(j.err || '發生錯誤');
  return j;
}
// 舊版存的資料少了新欄位
function fixLoaded() { if (!state.customs) state.customs = []; if (!outbox.cu) outbox.cu = []; }
function setAuth(r) { auth = { api: API, token: r.token, me: r.me }; localStorage.setItem('dfi_auth', JSON.stringify(auth)); }
async function logout(expired) {
  if (!expired && pendingCount() && !confirm(`還有 ${pendingCount()} 筆資料沒上傳，登出會丟掉。確定登出？`)) return;
  auth = null; localStorage.removeItem('dfi_auth');

const emptyState = () => ({ projects: [], vendors: [], defects: {}, customs: [] });

const CK = 'cache:' + API, OK = 'outbox:' + API;
let saveTimer, saving = Promise.resolve();

function persistNow() {
  clearTimeout(saveTimer);

  setSyncUI();

}
// 存一筆缺失（之後自動上傳）
function saveD(d, newPhotos) {
  state.defects[d.id] = d;
  outbox.d[d.id] = ++seq;
  (newPhotos || []).forEach(id => { if (!outbox.ph.includes(id)) outbox.ph.push(id); });
  persist();
}
const pendingCount = () => outbox.ph.length + Object.keys(outbox.d).length + outbox.del.length + (outbox.cu || []).length;
const isPending = id => !!outbox.d[id];
let syncing = false, pulling = false, pullAgain = false, syncErr = '', syncTimer, lastPull = 0;
function setSyncUI() {
  const el = $('sync');
  if (!auth || VCODE) { el.textContent = ''; return; }
  const n = pendingCount();
  el.textContent = syncing ? '⏳ 上傳中' : n ? (syncErr ? `⚠️ ${n} 筆未上傳` : `⏳ ${n}`) : '☁️ 已同步';
  el.title = syncErr || '';
}
function scheduleSync(ms) { clearTimeout(syncTimer); syncTimer = setTimeout(sync, ms || 800); }
function syncNow() { if (syncErr) toast(syncErr); return sync(); }
// 上傳給後端的欄位（v、at、who 是後端的）
function payload(d) { const o = clone(d); delete o.v; delete o.at; delete o.who; return o; }
const SERVER_KEYS = ['no', 'created', 'by', 'byUser', 'fixes', 'log', 'acked'];
async function sync() {
  if (!auth || syncing) return;
  if (pulling) { scheduleSync(1500); return; }
  if (!pendingCount()) { syncErr = ''; setSyncUI(); return; }
  syncing = true; setSyncUI();
  // 伺服器拒絕的（不是網路問題）就略過，不要卡住後面的資料
  const skipBad = async fn => { try { return await fn(); } catch (e) { if (!(e instanceof ServerError)) throw e; toast(e.message); return null; } };
  let needPull = false;
  try {
    while (outbox.ph.length) {
      const id = outbox.ph[0], data = await photoGet(id);
      if (data) await skipBad(() => api('uploadPhoto', { id, data }));
      outbox.ph.shift(); await persistNow();
    }
    while (outbox.cu.length) {
      await skipBad(() => api('saveCustom', outbox.cu[0]));
      outbox.cu.shift(); await persistNow();
      needPull = true;
    }
    while (outbox.del.length) {
      await skipBad(() => api('deleteDefect', { id: outbox.del[0] }));
      outbox.del.shift(); await persistNow();
    }
    for (const [id, n] of Object.entries(outbox.d)) {
      const d = state.defects[id];
      if (!d) { delete outbox.d[id]; continue; }
      const r = await skipBad(() => api('saveDefect', { defect: payload(d), baseV: d.v || 0 }));
      if (!r) { delete outbox.d[id]; needPull = true; }
      else if (r.conflict) { state.defects[id] = r.defect; delete outbox.d[id]; toast(r.err + '，請再確認一次'); }
      else if (r.gone) { delete state.defects[id]; delete outbox.d[id]; toast(r.err); }
      else if (outbox.d[id] === n) { state.defects[id] = r.defect; delete outbox.d[id]; }
      else {
        // 上傳時又改了：保留手機上的新修改，只更新後端管的欄位，等一下再傳一次
        const cur = state.defects[id];
        SERVER_KEYS.forEach(k => { cur[k] = r.defect[k]; });
        cur.v = r.v;
        cur.reviews = r.defect.reviews.concat((cur.reviews || []).slice(r.defect.reviews.length));
      }
      await persistNow();
    }
    syncErr = '';
  } catch (e) { syncErr = e.message; }
  syncing = false;
  setSyncUI(); render(true);
  if (pendingCount()) scheduleSync(syncErr ? 20000 : 300);
  else if (needPull || pullAgain) { pullAgain = false; pull(true); }
}
// 從雲端拿最新資料（還沒上傳的修改蓋在上面）
async function pull(quiet) {
  if (!auth) return;
  if (pulling || syncing) { pullAgain = true; return; }
  pulling = true;
  try {
    const r = await api('list');
    const defects = {};
    r.defects.forEach(d => { defects[d.id] = d; });
    Object.keys(outbox.d).forEach(id => { if (state.defects[id]) defects[id] = state.defects[id]; });
    outbox.del.forEach(id => { delete defects[id]; });
    // 共用工項／常用語：雲端的＋還沒上傳的修改
    let customs = r.customs || [];
    outbox.cu.forEach(o => { customs = applyCustom(customs, o); });
    state = { projects: r.projects, vendors: r.vendors, defects, customs };
    lastPull = Date.now();
    await persistNow();
  } catch (e) { if (!quiet) toast(e.message); }

  render(true);

}

function changePass() {
  sheet(`<h3>改密碼</h3><label class="f">舊密碼</label><input type="password" id="po"><label class="f">新密碼（至少 6 個字）</label><input type="password" id="pn">
    <button class="btn block" onclick="doChangePass(this)">確定</button><button class="btn ghost block" onclick="closeLayer()">取消</button>`);
}
async function doChangePass(b) {
  b.disabled = true;
  try { setAuth(await api('changePass', { old: $('po').value, pass: $('pn').value })); closeLayer(); toast('密碼已更改'); }
  catch (e) { toast(e.message); b.disabled = false; }
}
VIEWS.projects = () => {
  hdr('建案管理', { right: ['＋ 新增', () => editProject(null)] });
  return `<div class="card">${state.projects.map(p => `<div class="user-row" onclick="editProject('${p.id}')"><b class="grow">${esc(p.name)}</b>${p.disabled ? '<span class="tag pend">停用</span>' : ''}<span class="muted">${Object.values(state.defects).filter(d => d.pid === p.id).length} 件</span></div>`).join('') || '<div class="muted">還沒有建案</div>'}</div>
    <button class="btn block" onclick="editProject(null)">＋ 新增建案</button>`;
};
function editProject(id) {
  const p = id ? state.projects.find(x => x.id === id) : null;
  sheet(`<h3>${p ? '修改建案' : '新增建案'}</h3><label class="f">建案名稱</label><input type="text" id="pjn" value="${esc(p ? p.name : '')}">
    ${p ? `<label style="display:block;margin-top:12px"><input type="checkbox" id="pjd" ${p.disabled ? 'checked' : ''}> 停用（完工的建案，不再出現在選單）</label>` : ''}
    <button class="btn block" onclick="saveProject('${p ? p.id : ''}',this)">儲存</button><button class="btn ghost block" onclick="closeLayer()">取消</button>`);
}
async function saveProject(id, b) {
  b.disabled = true;
  const p = { id: id || uid(), name: $('pjn').value.trim(), disabled: !!($('pjd') && $('pjd').checked) };
  try {
    await api('saveProject', { project: p });
    const i = state.projects.findIndex(x => x.id === p.id);
    if (i >= 0) state.projects[i] = p; else { state.projects.push(p); localStorage.setItem('dfi_pid', p.id); }
    persistNow(); closeLayer(); render(); toast('已儲存');
  } catch (e) { toast(e.message); b.disabled = false; }
}
let users = null;
VIEWS.users = () => {
  hdr('帳號管理', { right: ['＋ 新增', () => editUser(null)] });
  if (!users) { api('listUsers').then(r => { users = r.users; render(); }).catch(e => toast(e.message)); return '<div class="empty">讀取中…</div>'; }
  return `<div class="card">${users.map(u => `<div class="user-row" onclick="editUser(${jsq(u.user)})"><div class="grow"><b>${esc(u.name)}</b><div class="muted">${esc(u.user)}・${ROLE_NAME[u.role]}</div></div>${u.disabled ? '<span class="tag pend">停用</span>' : ''}</div>`).join('')}</div>
    <div class="muted">工地人員：可以開單、複查、新增廠商。後台：另外可以管理建案、帳號、修改已結案的缺失。</div>`;
};
function editUser(user) {
  const u = user ? users.find(x => x.user === user) : null;
  sheet(`<h3>${u ? '修改帳號' : '新增帳號'}</h3>
    <label class="f">帳號（英文、數字）</label><input type="text" id="uu" value="${esc(u ? u.user : '')}" ${u ? 'disabled' : ''} autocapitalize="off">
    <label class="f">姓名</label><input type="text" id="un" value="${esc(u ? u.name : '')}">
    <label class="f">角色</label><select id="ur"><option value="staff">工地人員</option><option value="admin" ${u && u.role === 'admin' ? 'selected' : ''}>後台</option></select>
    <label class="f">${u ? '重設密碼（不改就空白）' : '密碼（至少 6 個字）'}</label><input type="password" id="up" autocomplete="new-password">
    ${u ? `<label style="display:block;margin-top:12px"><input type="checkbox" id="ud" ${u.disabled ? 'checked' : ''}> 停用這個帳號</label>` : ''}
    <button class="btn block" onclick="saveUser(${u ? 'false' : 'true'},this)">儲存</button><button class="btn ghost block" onclick="closeLayer()">取消</button>`);
}
async function saveUser(isNew, b) {
  b.disabled = true;
  try {
    await api('saveUser', { isNew, user: $('uu').value, name: $('un').value, role: $('ur').value, pass: $('up').value || undefined, disabled: !!($('ud') && $('ud').checked) });
    users = null; closeLayer(); render(); toast('已儲存');
  } catch (e) { toast(e.message); b.disabled = false; }
}

// ══ 廠商回報頁（?v=回報碼，不用登入）══════════════════
let VP = null, vpOpen = null, vpForm = null;
async function loadVendorPortal() {
  try { VP = await api('vendorList', { code: VCODE }); }
  catch (e) { VP = { err: e.message }; }
  render();
  const m = /#d=([a-z0-9]+)/.exec(location.hash);
  if (m && !vpOpen) {
    const el = $('vd-' + m[1]);
    if (el) { el.scrollIntoView({ block: 'center' }); el.classList.add('hl'); }
  }
}
function renderVendorPortal() {
  $('backBtn').style.display = 'none';
  $('nav').style.display = 'none';
  $('title').textContent = VP && VP.vendor ? VP.vendor.name + '｜缺失改善' : '缺失改善回報';
  const A = $('app');
  if (!VP) { A.innerHTML = '<div class="empty">讀取中…</div>'; return; }
  if (VP.err) { A.innerHTML = `<div class="card login"><h3>打不開</h3><p>${esc(VP.err)}</p><button class="btn block" onclick="VP=null;render();loadVendorPortal()">再試一次</button></div>`; return; }
  const ds = VP.defects, open = ds.filter(d => d.status === 'wait' || d.status === 'doing').sort((a, b) => a.due.localeCompare(b.due));
  const chk = ds.filter(d => d.status === 'check'), done = ds.filter(d => d.status === 'done');
  A.innerHTML = `<div class="card"><b>${esc(VP.vendor.name)}</b> 您好：<br><span class="muted">以下是工地巡檢發現、需要貴公司改善的缺失。改善完成後請按「回報改善完成」並拍照上傳，工地複查合格就會結案。</span></div>
    <h3 style="color:var(--steel);margin:16px 4px 8px">待改善（${open.length}）</h3>${open.map(vpCard).join('') || '<div class="empty">目前沒有待改善的缺失 👍</div>'}
    ${chk.length ? `<h3 style="color:var(--steel);margin:16px 4px 8px">已回報，等工地複查（${chk.length}）</h3>${chk.map(vpCard).join('')}` : ''}
    ${done.length ? `<h3 style="color:var(--steel);margin:16px 4px 8px">最近結案（${done.length}）</h3>${done.map(vpCard).join('')}` : ''}
    <div class="ver">小棒槌 缺失改善系統</div>`;
  hydratePhotos(A);
}
function vpCard(d) {
  const back = (d.reviews || []).slice(-1)[0], fix = (d.fixes || []).slice(-1)[0];
  const can = d.status === 'wait' || d.status === 'doing';
  photoLists['vp-' + d.id] = { get: () => d.photos, editable: false };
  let form = '';
  if (vpOpen === d.id) {
    photoLists.vpf = { get: () => vpForm.photos, editable: false, changed: render };
    photoTargets.vpf = id => { vpForm.photos.push(id); render(); };
    form = `<div style="border-top:1px dashed var(--line);margin-top:10px;padding-top:6px">
      <label class="f">改善後照片（至少 1 張）</label>
      <div class="photos">${vpForm.photos.map((id, i) => `<div class="ph">${imgTag(id)}<button class="x" onclick="vpForm.photos.splice(${i},1);render()">✕</button></div>`).join('')}${vpForm.photos.length < 10 ? photoAdders('vpf') : ''}</div>
      <label class="f">說明（可不填）</label><textarea oninput="vpForm.note=this.value" placeholder="例如：已打除修補完成">${esc(vpForm.note)}</textarea>
      <button class="btn ok block" id="vpSend" onclick="vpSubmit('${d.id}')">送出回報</button>
      <button class="btn ghost block" onclick="vpOpen=null;render()">取消</button></div>`;
  }
  return `<div class="card" id="vd-${d.id}">
    <div class="row wrap"><b>${noText(d)}</b>${stTag(d)}${catTag(d.cat)}</div>
    <div class="muted">${esc(d.project)}</div>
    <table class="kv" style="margin-top:6px"><tr><th>位置</th><td>${esc(locText(d))}</td></tr>
      <tr><th>工項</th><td>${esc(d.cat)}${d.trade ? '／' + esc(d.trade) : ''}</td></tr>
      <tr><th>缺失</th><td style="white-space:pre-wrap">${esc(d.note) || '（見照片）'}</td></tr>
      ${d.req ? `<tr><th>改善要求</th><td style="white-space:pre-wrap">${esc(d.req)}</td></tr>` : ''}
      <tr><th>期限</th><td>${dueText(d, true)}</td></tr></table>
    <div class="photos">${photoRow(d.photos, 'vp-' + d.id, false)}</div>
    ${back && !back.ok && can ? `<div class="sub ng"><b>工地複查不合格（${esc((back.at || '').slice(0, 10))}）</b><div>${esc(back.note)}</div><div class="photos">${(back.photos || []).map(phView).join('')}</div></div>` : ''}
    ${fix && !can ? `<div class="sub fix"><b>您的回報</b>　<span class="muted">${esc(fix.at)}</span>${fix.note ? `<div>${esc(fix.note)}</div>` : ''}<div class="photos">${fix.photos.map(phView).join('')}</div></div>` : ''}
    ${can && vpOpen !== d.id ? `<div class="row" style="margin-top:10px">${d.status === 'wait' ? `<button class="btn ghost grow" onclick="vpAck('${d.id}',this)">收到，處理中</button>` : ''}<button class="btn ok grow" onclick="vpOpen='${d.id}';vpForm={photos:[],note:''};render()">回報改善完成</button></div>` : ''}
    ${form}</div>`;
}
async function vpAck(id, b) {
  b.disabled = true;
  try { await api('vendorAck', { code: VCODE, id }); toast('已通知工地：處理中'); await loadVendorPortal(); }
  catch (e) { toast(e.message); b.disabled = false; }
}
async function vpSubmit(id) {
  if (!vpForm.photos.length) { toast('請至少拍一張改善後的照片'); return; }
  const b = $('vpSend'); b.disabled = true;
  try {
    for (let i = 0; i < vpForm.photos.length; i++) {
      b.textContent = `上傳照片 ${i + 1}/${vpForm.photos.length}…`;
      const pid = vpForm.photos[i];
      await api('vendorUpload', { code: VCODE, id, photo: pid, data: await photoGet(pid) });
    }
    b.textContent = '送出中…';
    await api('vendorReport', { code: VCODE, id, note: vpForm.note.trim(), photos: vpForm.photos });
    vpOpen = null; vpForm = null;
    toast('已回報，等工地複查');
    await loadVendorPortal();
  } catch (e) { toast(e.message); b.disabled = false; b.textContent = '送出回報'; }
}

// ── 啟動 ─────────────────────────────
(async () => {
  if (VCODE) { render(); loadVendorPortal(); return; }
  if (auth) {
    const saved = await idbGet('kv', CK), box = await idbGet('kv', OK);
    if (saved) state = saved;
    if (box) { outbox = box; seq = Math.max(0, ...Object.values(outbox.d)); }
    fixLoaded(); migrateLocalCustoms();
    // 有沒存完的新缺失 → 直接回到新增畫面
    if (localStorage.getItem('dfi_draft')) { stack.push({ name: 'home' }); view = { name: 'edit' }; startDraft(null); }
    render();
    pull(true);
  } else render();
  if ('serviceWorker' in navigator && location.protocol !== 'file:') navigator.serviceWorker.register('sw.js');
})();
</script>
